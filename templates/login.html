<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IMOEX DCA — Login</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body">
  <div class="auth-card">
    <h1>IMOEX DCA</h1>
    <p class="muted" id="auth-subtitle">
      {% if mode == "setup" %}First run — create a password to protect your portfolio data.{% else %}Enter your password to continue.{% endif %}
    </p>
    <form id="auth-form">
      <input type="password" id="password" placeholder="Password" autofocus required>
      {% if mode == "setup" %}
      <input type="password" id="password2" placeholder="Repeat password" required>
      {% endif %}
      <button type="submit" id="auth-btn">
        {% if mode == "setup" %}Create password{% else %}Log in{% endif %}
      </button>
    </form>
    <p class="error" id="auth-error" hidden></p>
  </div>

  <script>
    const isSetup = {{ "true" if mode == "setup" else "false" }};
    const form = document.getElementById('auth-form');
    const btn = document.getElementById('auth-btn');
    const err = document.getElementById('auth-error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.hidden = true;
      btn.disabled = true;

      const password = document.getElementById('password').value;
      if (isSetup) {
        const password2 = document.getElementById('password2').value;
        if (password !== password2) {
          err.textContent = 'Passwords do not match';
          err.hidden = false;
          btn.disabled = false;
          return;
        }
      }

      try {
        const r = await fetch(isSetup ? '/api/setup' : '/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        if (!r.ok) {
          const body = await r.json().catch(() => ({}));
          throw new Error(body.detail || `HTTP ${r.status}`);
        }
        window.location.href = '/';
      } catch (ex) {
        err.textContent = ex.message;
        err.hidden = false;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
