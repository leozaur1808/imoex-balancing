services:
  app:
    build: .
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8000
      # SQLite in the bind-mounted data/ dir (users, settings, positions,
      # runs, transactions) — the app creates the schema on first start.
      ConnectionStrings__Default: Data Source=/app/data/app.db
    volumes:
      - ./data:/app/data
    # No ports published — nginx is the only entry point.

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    # Change "8080" to whatever host port you want (e.g. "80:80").
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
